name: Release macOS
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: xcode-27
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check release version
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/tags/v* ]]
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)
          [[ "$GITHUB_REF_NAME" == "v$version" ]]
          echo "VERSION=$version" >> "$GITHUB_ENV"
      # CI already runs `make verify` on every push to main; repeating it here would only delay the release.
      - name: Require a passing CI run for this commit
        shell: bash
        run: |
          set -euo pipefail
          conclusion=$(gh run list -R "$GITHUB_REPOSITORY" --workflow CI --commit "$GITHUB_SHA" --status completed \
            --limit 1 --json conclusion --jq '.[0].conclusion // "none"')
          if [[ "$conclusion" != success ]]; then
            echo "::error::CI has not passed for $GITHUB_SHA (found: $conclusion). Wait for CI on main, then re-run this workflow."
            exit 1
          fi
      - name: Import Developer ID certificate
        env:
          CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/release.keychain-db"
          password=$(openssl rand -base64 32)
          echo "::add-mask::$password"
          printf '%s' "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" "$HOME/Library/Keychains/login.keychain-db"
          identity=$(security find-identity -v -p codesigning "$keychain" | sed -n "s/.*\"\(Developer ID Application:.*($APPLE_TEAM_ID)\)\"/\1/p" | head -1)
          [[ -n "$identity" ]]
          echo "SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"
          rm "$RUNNER_TEMP/certificate.p12"
      - name: Build signed Apple Silicon app
        env:
          FILTER_HOST_PROFILE: ${{ secrets.MACPOCKET_FILTER_HOST_PROFILE }}
          FILTER_PROVIDER_PROFILE: ${{ secrets.MACPOCKET_FILTER_PROVIDER_PROFILE }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$FILTER_HOST_PROFILE" && -n "$FILTER_PROVIDER_PROFILE" ]] || { echo "Network filter provisioning profiles are missing" >&2; exit 1; }
          printf '%s' "$FILTER_HOST_PROFILE" | base64 --decode > "$RUNNER_TEMP/filter-host.provisionprofile"
          printf '%s' "$FILTER_PROVIDER_PROFILE" | base64 --decode > "$RUNNER_TEMP/filter-provider.provisionprofile"
          export MACPOCKET_FILTER_HOST_PROFILE="$RUNNER_TEMP/filter-host.provisionprofile"
          export MACPOCKET_FILTER_PROVIDER_PROFILE="$RUNNER_TEMP/filter-provider.provisionprofile"
          MACPOCKET_SIGN_IDENTITY="$SIGNING_IDENTITY" scripts/build/build-app.sh release
          app=.build/MacPocket.app
          [[ "$(lipo -archs "$app/Contents/MacOS/MacPocket")" == arm64 ]]
          filter="$app/Contents/Library/SystemExtensions/com.doancan.MacPocket.NetworkFilter.systemextension"
          [[ -f "$filter/Contents/MacOS/MacPocketNetworkFilter" ]]
          codesign --verify --strict --verbose=2 "$filter"
          codesign --verify --strict --deep --verbose=2 "$app"
          codesign -dvv "$app" 2>&1 | grep -q 'flags=0x10000(runtime)'
      - name: Notarize and staple
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          app=.build/MacPocket.app
          ditto -c -k --keepParent "$app" "$RUNNER_TEMP/notarization.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarization.zip" \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" --wait --timeout 60m \
            --output-format json > "$RUNNER_TEMP/notarization.json"
          cat "$RUNNER_TEMP/notarization.json"
          if [[ "$(jq -r .status "$RUNNER_TEMP/notarization.json")" != Accepted ]]; then
            xcrun notarytool log "$(jq -r .id "$RUNNER_TEMP/notarization.json")" \
              --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" || true
            exit 1
          fi
          xcrun stapler staple "$app"
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose=2 "$app"
          mkdir -p dist
          ditto -c -k --keepParent "$app" "dist/MacPocket-$VERSION-macOS-arm64.zip"
          cd dist
          shasum -a 256 *.zip > SHA256SUMS
      - name: Build and notarize disk image
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          dmg="dist/MacPocket-$VERSION-macOS-arm64.dmg"
          scripts/build/build-dmg.sh .build/MacPocket.app "$dmg"
          codesign --force --sign "$SIGNING_IDENTITY" --timestamp "$dmg"
          codesign --verify --strict --verbose=2 "$dmg"
          xcrun notarytool submit "$dmg" \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" --wait --timeout 60m \
            --output-format json > "$RUNNER_TEMP/dmg-notarization.json"
          cat "$RUNNER_TEMP/dmg-notarization.json"
          if [[ "$(jq -r .status "$RUNNER_TEMP/dmg-notarization.json")" != Accepted ]]; then
            xcrun notarytool log "$(jq -r .id "$RUNNER_TEMP/dmg-notarization.json")" \
              --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" || true
            exit 1
          fi
          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$dmg"
          # A version-less copy gives the website a stable link: releases/latest/download/MacPocket-macOS-arm64.dmg
          cp "$dmg" dist/MacPocket-macOS-arm64.dmg
          cd dist
          shasum -a 256 *.zip *.dmg > SHA256SUMS
      - name: Sign update and build appcast
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$SPARKLE_ED_PRIVATE_KEY" ]] || { echo "SPARKLE_ED_PRIVATE_KEY secret is missing" >&2; exit 1; }
          scripts/release/make-appcast.sh "dist/MacPocket-$VERSION-macOS-arm64.zip" dist/appcast.xml
      - name: Publish GitHub release
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$VERSION" "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" "$RUNNER_TEMP/release-notes.md" <<'PY'
          import pathlib,re,sys
          version,repository,tag,destination=sys.argv[1:]
          text=pathlib.Path('CHANGELOG.md').read_text()
          match=re.search(r'^## '+re.escape(version)+r' —[^\n]*\n(.*?)(?=^## |\Z)',text,re.M|re.S)
          if not match or not match.group(1).strip(): raise SystemExit('Release notes are missing')
          body=match.group(1).strip()
          body=re.sub(r'\]\((docs/[^)]+)\)',lambda m: ']('+f'https://github.com/{repository}/blob/{tag}/'+m.group(1)+')',body)
          pathlib.Path(destination).write_text(body+'\n')
          PY
          gh release create "$GITHUB_REF_NAME" dist/*.zip dist/*.dmg dist/SHA256SUMS dist/appcast.xml \
            --verify-tag --title "MacPocket $VERSION" --notes-file "$RUNNER_TEMP/release-notes.md"
      - name: Remove signing material
        if: always()
        shell: bash
        run: |
          security delete-keychain "$RUNNER_TEMP/release.keychain-db" || true
          rm -f "$RUNNER_TEMP/certificate.p12" "$RUNNER_TEMP/filter-host.provisionprofile" "$RUNNER_TEMP/filter-provider.provisionprofile"
